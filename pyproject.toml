[project]
name = "api-printer-spooler-version-python-full"
version = "0.1.0"
description = "Proyecto para la gestión de una API de impresión y spooler en Python."
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "flask",
    "flask-cors",
    "requests",
    "pywin32; sys_platform == 'win32'",
    "pyserial",
    "textwrap3",
    "pillow",
    "jsonschema",
    "watchdog",
    "cx-freeze",
    "pystray",
    "pygobject; sys_platform == 'linux'",
    "ttkbootstrap>=2.2.3",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# EXE001: el shebang es parte de la cabecera estándar de los módulos y el bit
# de ejecución no se conserva en Windows (plataforma principal de compilación).
extend-ignore = ["EXE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
